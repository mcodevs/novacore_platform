# NovaCore CI — testlar majburiy (docs/05-delivery/01-roadmap.md §5):
# kodni AI yozgani uchun domen testlarisiz ishonch yo'q.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        run: pip install -r requirements.txt

      - name: Testlar (domen · bot · API · konfiguratsiya)
        run: pytest -q

      - name: Migratsiya toza bazada ishlaydimi
        run: mkdir -p var && alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
          BOT_TOKEN: "123456:CI"

  miniapp:
    name: Mini App (tsc · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - run: npm ci

      - name: Tiplarni tekshirish
        run: npm run typecheck

      - name: Testlar
        run: npm test

      - name: Yig'ish (bundle < 300 KB gzip bo'lishi kerak)
        run: npm run build

  audit:
    name: Bog'liqliklar auditi (maslahat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Yangi CVE PR'ni to'satdan qizil qilib qo'ymasin — natija ko'rinadi,
    # lekin merge'ni bloklamaydi (docs/02-architecture/06-security.md §9).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --strict
