# fly.io — bitta machine, bitta process (ADR-0004)
app = "novacore-platform"
primary_region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENV = "production"
  BOT_MODE = "webhook"
  BASE_URL = "https://novacore-platform.fly.dev"
  STORAGE_BACKEND = "s3"
  S3_ENDPOINT_URL = "https://fly.storage.tigris.dev"
  S3_BUCKET = "novacore-media"
  ANTIFRAUD_ENABLED = "false"
  DEFAULT_LANG = "uz"

[http_service]
  internal_port = 8000
  force_https = true          # Telegram Mini App shartsiz HTTPS talab qiladi
  auto_stop_machines = false  # fon sikli va webhook doim tirik bo'lishi kerak
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets (repoda YO'Q — `fly secrets set ...`):
#   BOT_TOKEN, WEBHOOK_SECRET, JWT_SECRET, DATABASE_URL,
#   S3_ACCESS_KEY, S3_SECRET_KEY, ADMIN_GROUP_ID
